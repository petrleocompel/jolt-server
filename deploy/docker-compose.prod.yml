# Production overlay. Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
services:
  db:
    ports: []          # never expose Postgres publicly
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://jolt:${POSTGRES_PASSWORD}@db:5432/jolt
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${APP_HOST:-jolt.example.com}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-cz.peelco.jolt}
      APNS_KEY_P8: ${APNS_KEY_P8}
      APNS_ENV: ${APNS_ENV:-production}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      db:
        condition: service_healthy

  # Same image, different entrypoint: runs the retention//cleanup jobs.
  cron:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do node --experimental-strip-types scripts/cron.ts; sleep 3600; done"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://jolt:${POSTGRES_PASSWORD}@db:5432/jolt
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${APP_HOST:-jolt.example.com}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      APP_HOST: ${APP_HOST:-jolt.example.com}
    depends_on:
      - app

volumes:
  caddydata:
  caddyconfig:
