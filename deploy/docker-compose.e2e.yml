# Throwaway Postgres for Playwright. Different port so it never collides with
# the dev stack.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jolt
      POSTGRES_PASSWORD: jolt
      POSTGRES_DB: jolt_e2e
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jolt"]
      interval: 3s
      retries: 10
