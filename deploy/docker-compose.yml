# Base stack. Every overlay builds on this one.
#
#   Local dev, database only (dev overlay publishes 5432 on loopback):
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d db
#
#   Self-hosting from source (adds Caddy for TLS; to run the published image
#   use the root compose.yaml, see https://petrleocompel.github.io/jolt-server/):
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.selfhost.yml up -d
#
#   Peelco test deploy (image from the registry, TLS via Traefik):
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml up -d
#
# The app is intentionally not published on a host port here. Each overlay
# decides how it is reached, so nothing is exposed by accident.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jolt}
      POSTGRES_DB: ${POSTGRES_DB:-jolt}
    # Deliberately not published. Compose *appends* sequences when overlaying,
    # so an overlay can never take a published port away again — publishing
    # here made the deploy collide with the Postgres already running on the
    # shared host ("Bind for 0.0.0.0:5432 failed: port is already allocated").
    # Add docker-compose.dev.yml when you want it reachable from the host.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jolt}"]
      interval: 5s
      retries: 5

  # Runs the Drizzle migrations once and exits. `app` waits for it to finish
  # successfully, so a fresh volume or a schema change never leaves the API
  # serving against an out-of-date database.
  migrate:
    image: ${JOLT_IMAGE:-jolt-server:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-jolt}:${POSTGRES_PASSWORD:-jolt}@db:5432/${POSTGRES_DB:-jolt}}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${JOLT_IMAGE:-jolt-server:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-jolt}:${POSTGRES_PASSWORD:-jolt}@db:5432/${POSTGRES_DB:-jolt}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://${APP_HOST:?set APP_HOST to your domain}}
      # Any other origin browsers reach this server on; sign-in is refused
      # from an origin the server does not trust.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-cz.peelco.jolt}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_ENV: ${APNS_ENV:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POKE_EVENT_RETENTION_DAYS: ${POKE_EVENT_RETENTION_DAYS:-90}
      FRIEND_REQUEST_EXPIRY_DAYS: ${FRIEND_REQUEST_EXPIRY_DAYS:-30}
      # Empty means unset: an admin decides at /admin/settings. true/false
      # pins it, and the admin page shows it locked.
      AUTOMATION_CONSENT_REQUIRED: ${AUTOMATION_CONSENT_REQUIRED:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Same image, different entrypoint: retention and cleanup jobs.
  cron:
    image: ${JOLT_IMAGE:-jolt-server:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do pnpm cron; sleep 3600; done"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-jolt}:${POSTGRES_PASSWORD:-jolt}@db:5432/${POSTGRES_DB:-jolt}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://${APP_HOST:?set APP_HOST to your domain}}
      POKE_EVENT_RETENTION_DAYS: ${POKE_EVENT_RETENTION_DAYS:-90}
      FRIEND_REQUEST_EXPIRY_DAYS: ${FRIEND_REQUEST_EXPIRY_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
