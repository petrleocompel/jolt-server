# Base stack: Postgres for local development.
#   docker compose -f deploy/docker-compose.yml up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jolt
      POSTGRES_PASSWORD: jolt
      POSTGRES_DB: jolt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jolt"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
