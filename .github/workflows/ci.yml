name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm generate-routes
      - run: pnpm typecheck
      # Fails when openapi/jolt-v1.yaml and src/api/schemas.ts disagree.
      - run: pnpm openapi:check
      - run: pnpm test
