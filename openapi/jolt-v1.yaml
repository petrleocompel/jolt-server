openapi: 3.0.3
info:
  title: Jolt Social API
  version: 0.1.0
  description: >
    The API the Jolt iOS app uses for accounts, friends and pokes. The app's
    in-memory `MockSocialBackend` implements this same contract, so the server
    is a drop-in replacement for it: no client changes beyond swapping the
    repository implementation and setting a base URL.

    Scope, per product decision: no discovery. A friend request always
    targets someone specific, either by their exact `@handle` or by an
    invite code/QR they shared out-of-band. Permissions are per-stimulus
    (zap/vibe/beep), each with its own allow flag, intensity cap, and
    cooldown, and are always edited from the *granter's* side.

servers:
  - url: /api/v1
    description: The server this document was fetched from (/openapi.yaml).
  - url: http://127.0.0.1:3000/api/v1
    description: Local development.

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
    description: >
      Your own account. `/me` and `/me/stimulus` also accept a personal
      access token (`patAuth`) — token management itself does not.
  - name: devices
  - name: friends
  - name: pokes

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, handle, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                handle:
                  type: string
                  description: Unique, lowercase, no `@` prefix. No discovery — this is how friends find *you*.
                  pattern: '^[a-z0-9_]{3,20}$'
                displayName: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email or handle already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session token
      responses:
        '204': { description: Logged out }

  /me:
    get:
      tags: [auth]
      summary: Current account, including your own invite code
      description: >
        Also readable with any valid personal access token, whatever its
        scopes — an integration usually needs the account's id or handle
        first.
      security:
        - bearerAuth: []
        - patAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /me/stimulus:
    post:
      tags: [me]
      summary: Fire a stimulus at your own devices
      description: >
        "Let my own code jolt me." No friendship and no permission grant is
        involved — the only person in this request is the one holding the
        credential. A personal access token needs the `stimulus:self` scope
        (or `*`).


        It is still recorded as a `PokeEvent` from you to you (so it shows in
        the activity feed and acks through `POST /pokes/{pokeId}/ack`) and is
        delivered as an ordinary poke push, which is what lets an existing
        client fire it with no changes.


        Rate limited to one per second per account. Through a personal access
        token, also subject to that token's own limits — `allowedKinds`,
        `maxIntensity` and `minIntervalSeconds`.


        The body is **strict**: any unknown field is a 400. This one differs
        from `POST /pokes` by a single field, and a caller that means to poke
        a friend but sends `{ friendId, stimulus }` here would otherwise have
        `friendId` dropped and be told 201 — for a stimulus fired at itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stimulus]
              additionalProperties: false
              properties:
                stimulus: { $ref: '#/components/schemas/StimulusConfig' }
      security:
        - bearerAuth: []
        - patAuth: []
      responses:
        '201':
          description: Recorded and queued for push delivery, `status` `pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PokeEvent' }
        '403':
          description: >
            A personal access token without the `stimulus:self` scope
            (`This token lacks the "stimulus:self" scope.`), or a stimulus
            outside the token's own limits (`This token can't send zap.`,
            `Intensity exceeds this token's cap of 30.`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No registered devices to fire it on
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >
            More than one per second, or — through a personal access token —
            sooner than the token's `minIntervalSeconds` allows
            (`Too fast — this token fires at most once every 5s. Try again
            in 3s.`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/tokens:
    get:
      tags: [me]
      summary: Your personal access tokens
      description: >
        Session only. A personal access token cannot list, mint or revoke
        tokens — one that could mint another would survive its own revocation.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        '403':
          description: Presented a personal access token rather than a session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [me]
      summary: Mint a personal access token
      description: >
        The response is the only time the secret is returned; only its hash is
        stored, so a lost token is replaced rather than looked up. A token
        cannot be edited after it is minted — mint a new one and revoke the
        old.


        The body is **strict**: an unknown field is a 400. A misspelt
        `friendIds` would otherwise be dropped, and the token would reach
        every friend instead of the ones it named.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: What it is for — "home assistant", "focus timer".
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Omit for a token that lives until revoked.
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ApiTokenScope' }
                  description: What the token may do. See `ApiTokenScope`.
                friendIds:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: >
                    Present — even empty — makes the token `selected`: it
                    reaches only these friends (and an empty list reaches
                    nobody). Absent makes it `all`: every friend, including
                    ones added later. Each id must be a current friend.
                allowedKinds:
                  type: array
                  nullable: true
                  minItems: 1
                  items: { $ref: '#/components/schemas/StimulusKind' }
                  description: >
                    The kinds it may fire, at you or at a friend. Null or
                    absent: every kind.
                maxIntensity:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100
                  description: >
                    Its own intensity ceiling, applied on top of the
                    recipient's cap — the lower of the two wins. Null or
                    absent: only the recipient's cap.
                minIntervalSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  default: 1
                  description: >
                    Minimum seconds between two stimuli fired with this
                    token, self and friend pokes alike, on top of the
                    recipient's cooldown and the one-per-second
                    self-stimulus limit. Held in the database, so it holds
                    across server instances and restarts.
      responses:
        '201':
          description: Created — save `token` now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        '400':
          description: >
            Invalid body — including an unknown field, an empty `scopes`, or
            a `friendIds` entry that is not one of your friends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/tokens/{tokenId}:
    delete:
      tags: [me]
      summary: Revoke a personal access token
      description: Revoking deletes the row; the token stops working immediately.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked }
        '404':
          description: No token of yours with that id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /push/config:
    get:
      tags: [devices]
      summary: How this server wants the app to register for pushes
      description: >
        Read before registering for pushes. `apns`: the server has Apple
        credentials of its own, and the app registers its APNs token directly
        with `POST /devices/push-token`. `relay`: the server pushes through the
        Jolt push relay, so the app registers with the relay at `relay.url`
        for `relay.serverId` and then hands the server the relay's token and a
        payload key. `none`: the server delivers no pushes; register nothing.


        The relay protocol itself is specified in the jolt-relay repository
        (`spec/protocol-v1.md`). An app only registers with relay hosts it has
        built in, whatever URL a server names here. The server only answers
        `relay` once the relay has accepted its registration, so a device
        registration never meets `unknown_server`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushConfig' }
        '503':
          description: >
            The server delivers through the relay, but the relay has not
            accepted its registration: it cannot be reached, it failed, or it
            has blocked this server. Keep the current push registration and
            ask again later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /devices/push-token:
    post:
      tags: [devices]
      summary: Register this device for pushes to the signed-in account
      description: >
        Called once per launch, after the app has its APNs token
        (`application(_:didRegisterForRemoteNotificationsWithDeviceToken:)`)
        or, for a server whose `GET /push/config` says `relay`, after it
        has registered with the relay. A user may have multiple registered
        devices; poke pushes fan out to all of them.


        Two shapes. The original `{token, platform}` is an APNs registration;
        a missing `transport` means `apns`, so app builds from before the
        relay keep working. A relay registration carries the `relayToken` the
        relay issued, the `payloadKey` the app decrypts its pushes with, and
        that key's `keyId`; a `keyId` that is not derived from `payloadKey`
        is refused with 400. Registering the same token again moves it to the
        caller and replaces the key.


        A relay token the relay has reported `unregistered` stays disabled:
        posting it again gets `410` with `error: relay_token_revoked`, and the
        device is not re-enabled. The app then discards that `relayToken` and
        its `payloadKey`, registers with the relay again, and posts the new
        token. A disabled APNs token, by contrast, is re-enabled by
        registering it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ApnsPushTokenRegistration'
                - $ref: '#/components/schemas/RelayPushTokenRegistration'
      responses:
        '204': { description: Registered }
        '400':
          description: Neither shape, or a `keyId` that does not match `payloadKey`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: >
            The relay has revoked this `relayToken` (`error:
            relay_token_revoked`). Register with the relay again and post the
            new token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                message: The relay has revoked this registration. Register with the relay again.
                error: relay_token_revoked
    delete:
      tags: [devices]
      summary: Forget this device's push registration on sign-out
      description: >
        The other half of the POST. Without it the registration outlives the
        session: a phone that signed in as someone else and signed out again
        stays a delivery target for that account until something re-registers
        the token, so a poke sent *to* that account fires on a wrist that has
        nothing to do with it.


        Scoped to the caller — a token registered to another account is left
        alone, and the response is 204 either way. Send the token the device
        registered with: `token` for APNs, `relayToken` for the relay. The
        relay registration itself is the app's to revoke, with
        `POST /v1/devices/unregister` at the relay; the server never revokes
        it. Whenever the app replaces a registration (switching transport,
        getting a new `relayToken`, switching server) it removes the old one
        here as well, or the phone gets every poke twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [token]
                  properties:
                    token: { type: string, description: Hex-encoded APNs device token }
                - type: object
                  required: [relayToken]
                  properties:
                    relayToken: { type: string, description: The relay token the device registered with }
      responses:
        '204': { description: Forgotten, or never registered here }

  /devices:
    get:
      tags: [devices]
      summary: Your own registered devices
      description: >
        Backs the "test my notifications" screens — /dashboard/devices on the
        web and Settings → Notifications in the app. Only the last 8
        characters of each APNs or relay token are returned, which is enough
        for a phone to recognise itself in the list and useless to anybody
        else.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }

  /devices/test-push:
    post:
      tags: [devices]
      summary: Send yourself a test push
      description: >
        Sends the same alert + silent pair a poke does, but with a
        `type: "test"` payload (see `TestPushPayload`) and no `poke_event`
        behind it — this exists to isolate APNs delivery from the friends and
        permission logic.


        Omit `stimulus` for a notification-only test: nothing fires on the
        wearable, so delivery can be checked with no device connected. Include
        it to exercise the whole chain down to the Pavlok.


        Omit `deviceId` to fan out to every active device. Rate limited to one
        test per 5 seconds per account.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  format: uuid
                  description: Defaults to every active device.
                stimulus:
                  allOf: [{ $ref: '#/components/schemas/StimulusConfig' }]
                  description: Omit for a notification-only test.
      responses:
        '200':
          description: Handed to APNs. Delivery is confirmed by the device's ack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPushStatus' }
        '404':
          description: No registered devices, or no such device of yours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many test pushes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /devices/test-push/{testID}:
    get:
      tags: [devices]
      summary: State of a test push, including any acks so far
      description: >
        Poll this after sending to watch the device confirmations arrive.
        Tests are held in memory for 10 minutes and then 404 — they are a live
        diagnostic, not history.
      parameters:
        - name: testID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPushStatus' }
        '404':
          description: Unknown or expired test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /devices/test-push/{testID}/ack:
    post:
      tags: [devices]
      summary: Confirm a test push arrived on this device
      description: >
        Sent by the client the moment it sees a `type: "test"` payload. `path`
        says which iOS entry point saw it, so the alert and background halves
        of the same test show up as separate confirmations. Idempotent per
        (device, path).
      parameters:
        - name: testID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                deviceId:
                  type: string
                  format: uuid
                  description: Echoed from `deviceID` in the payload.
                path: { type: string, enum: [alert, background, foreground] }
                status:
                  type: string
                  enum: [fired, deviceNotConnected, notAllowed, muted]
                  description: What happened when firing, for a test that carried a stimulus.
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestPushStatus' }
        '404':
          description: Unknown or expired test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /friends:
    get:
      tags: [friends]
      summary: Accepted friends, with the permissions each side has granted
      description: >
        A personal access token needs `friends:read` (or `*`). A token whose
        friend scope is `selected` sees only the friends it was minted for.
      security:
        - bearerAuth: []
        - patAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Friend' }
        '403':
          description: A personal access token without the `friends:read` scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /friends/{friendId}:
    delete:
      tags: [friends]
      summary: Remove a friend (unfriend both directions)
      parameters:
        - $ref: '#/components/parameters/FriendId'
      responses:
        '204': { description: Removed }

  /friends/{friendId}/permissions/{stimulusKind}:
    put:
      tags: [friends]
      summary: Set what this friend is allowed to send you, for one stimulus kind
      description: >
        Always edits *your* grant to them — never the reverse.


        `isAllowed`, `maxIntensity` and `cooldownSeconds` overwrite, as they
        always have. `automationAllowed` does not: leaving the key out keeps
        whatever answer is stored (an app built before it existed sends only
        the other three, and must not wipe an answer given elsewhere), while
        `null` explicitly resets it to the server default. Read-only response
        keys such as `automationAllowedEffective` are ignored if sent.
      parameters:
        - $ref: '#/components/parameters/FriendId'
        - $ref: '#/components/parameters/StimulusKindParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StimulusPermissionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StimulusPermission' }

  /friends/requests:
    get:
      tags: [friends]
      summary: Pending requests, both directions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  incoming:
                    type: array
                    items: { $ref: '#/components/schemas/FriendRequest' }
                  outgoing:
                    type: array
                    items: { $ref: '#/components/schemas/FriendRequest' }
    post:
      tags: [friends]
      summary: Send a friend request by handle or invite code
      description: Exactly one of `handle` / `inviteCode` must be set — there is no discovery/search endpoint by design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle: { type: string }
                inviteCode: { type: string }
              minProperties: 1
              maxProperties: 1
      responses:
        '201':
          description: Request sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequest' }
        '404':
          description: No account with that handle/invite code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already friends, or a request already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /friends/requests/{requestId}/accept:
    post:
      tags: [friends]
      summary: Accept an incoming request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Now friends — both sides start with all stimuli disabled until each grants permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Friend' }

  /friends/requests/{requestId}/reject:
    post:
      tags: [friends]
      summary: Reject an incoming request (or cancel one you sent)
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Removed }

  /pokes:
    get:
      tags: [pokes]
      summary: Activity log — sent and received, newest first
      description: >
        A personal access token needs `pokes:read` (or `*`) and sees only
        part of the log: pokes with the friends it reaches (every friend,
        past ones included, for friend scope `all`; only the listed ones for
        `selected`), plus your own self-stimuli if — and only if — it may
        fire them (`stimulus:self` or `*`).
      security:
        - bearerAuth: []
        - patAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: before
          in: query
          description: Return events created before this event's timestamp (pagination cursor)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PokeEvent' }
        '403':
          description: A personal access token without the `pokes:read` scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [pokes]
      summary: Send a poke
      description: >
        Server re-validates the sender's permission grant server-side
        (client-side clamping in the composer is UX only, not
        authoritative) and pushes `PokePushPayload` to every device the
        recipient has registered, as both a standard alert push (guarantees
        the recipient finds out — see delivery-model note below) and a
        best-effort silent `content-available` push (may fire without the
        recipient touching anything, but iOS gives no delivery-time
        guarantee).


        A personal access token needs `pokes:send` (or `*`), and may only
        poke friends it reaches. Its own limits — `allowedKinds`,
        `maxIntensity`, `minIntervalSeconds` — apply on top of the friend's
        grant; a token can narrow what the friend allows you, never widen it.
        A retry with a `pokeId` already on record is answered before any of
        them, like every other check.
      security:
        - bearerAuth: []
        - patAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friendId, stimulus]
              properties:
                friendId: { type: string, format: uuid }
                stimulus: { $ref: '#/components/schemas/StimulusConfig' }
                pokeId:
                  type: string
                  format: uuid
                  description: >
                    Optional, chosen by the client. Sending the same `pokeId`
                    again answers `200` with the poke already recorded rather
                    than sending a second one — so a client that lost the
                    connection before the answer arrived can retry safely, or
                    look the id up in `GET /pokes` to learn whether it landed.
                    Omit it and every request is a new poke.
      responses:
        '200':
          description: >
            A retry: this `pokeId` was already recorded by the same sender. The
            original is returned as it stands and nothing is pushed again.
            Permission and cooldown are not re-checked — the poke was already
            sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PokeEvent' }
        '409':
          description: The `pokeId` belongs to another sender's poke.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '201':
          description: >
            Poke accepted and queued for push delivery. `status` is always
            `pending` here — it reflects only that the *permission* check
            passed, not whether the stimulus actually fired. The recipient's
            device reports the real outcome via `POST /pokes/{pokeId}/ack`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PokeEvent' }
        '403':
          description: >
            Recipient hasn't allowed this stimulus, or intensity exceeds their
            cap. With a personal access token, also: `This token lacks the
            "pokes:send" scope.`, `This token isn't allowed to poke that
            friend.` for a friend outside a `selected` token's list, or a
            stimulus outside the token's limits (`This token can't send
            zap.`, `Intensity exceeds this token's cap of 30.`), or a
            recipient who has not allowed automated pokes of that stimulus
            from you (`They haven't allowed automated pokes of that
            stimulus.` — see `StimulusPermission.automationAllowed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >
            Personal access token only: sooner than the token's
            `minIntervalSeconds` allows. The recipient's own cooldown is
            still a 403, as before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pokes/{pokeId}/ack:
    post:
      tags: [pokes]
      summary: Recipient's device reports what actually happened
      description: >
        Called by `JoltAppDelegate`/`AppNotificationDelegate` after handling
        an incoming push — see `PokeRepository.handleIncomingPoke(_:)`.
        Idempotent: acking the same `pokeId` twice (e.g. once from a silent
        push, once from a notification tap) must not change the recorded
        status after the first ack.
      parameters:
        - name: pokeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/PokeDeliveryStatus' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PokeEvent' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patAuth:
      type: http
      scheme: bearer
      description: >
        A personal access token (`jolt_pat_…`), minted at `POST /me/tokens`
        and pasted into a third-party integration. What it may do is set by
        its scopes (see `ApiTokenScope`):


        - `GET /me` — any valid token

        - `POST /me/stimulus` — `stimulus:self`

        - `POST /pokes` — `pokes:send`

        - `GET /friends` — `friends:read`

        - `GET /pokes` — `pokes:read`


        `*` grants every scope, including ones added later. A token missing
        the scope an endpoint needs gets `403 This token lacks the "<scope>"
        scope.` Every other endpoint — token management, devices, friend
        requests, permission editing, acks — is session-only and answers a
        token with 403, not 401, so an integrator is told the token is fine
        but the endpoint is not.

  parameters:
    FriendId:
      name: friendId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StimulusKindParam:
      name: stimulusKind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/StimulusKind' }

  schemas:
    StimulusKind:
      type: string
      enum: [zap, vibe, beep]

    StimulusConfig:
      type: object
      required: [kind, intensity, repetitions]
      properties:
        kind: { $ref: '#/components/schemas/StimulusKind' }
        intensity: { type: integer, minimum: 0, maximum: 100 }
        repetitions: { type: integer, minimum: 1, maximum: 5 }

    StimulusPermission:
      type: object
      required: [isAllowed, maxIntensity, cooldownSeconds, automationAllowed, automationAllowedEffective]
      properties:
        isAllowed: { type: boolean }
        maxIntensity: { type: integer, minimum: 0, maximum: 100 }
        cooldownSeconds:
          type: integer
          minimum: 0
          description: Minimum seconds between pokes of this kind from this friend; enforced server-side.
        automationAllowed:
          type: boolean
          nullable: true
          description: >
            The granter's explicit answer to "may this friend's automations
            (pokes sent with their personal access tokens) send me this
            too?". Null means no answer yet, which follows the server policy
            (`Me.policies.automationConsentRequired`). An explicit answer
            always wins, and a policy change never rewrites it. Only matters
            while `isAllowed` is true; self-stimuli are never subject to it.
        automationAllowedEffective:
          type: boolean
          description: >
            Whether automated pokes are accepted right now:
            `automationAllowed`, or — when that is null — true unless the
            server requires consent. Read-only.

    StimulusPermissionUpdate:
      type: object
      description: >
        Body of `PUT /friends/{friendId}/permissions/{stimulusKind}`. The
        three grant keys overwrite. `automationAllowed` is optional and
        three-valued: absent leaves the stored answer unchanged, `true` /
        `false` set it, `null` resets it to the server default.
      required: [isAllowed, maxIntensity, cooldownSeconds]
      properties:
        isAllowed: { type: boolean }
        maxIntensity: { type: integer, minimum: 0, maximum: 100 }
        cooldownSeconds: { type: integer, minimum: 0 }
        automationAllowed:
          type: boolean
          nullable: true

    FriendPermissionSet:
      type: object
      required: [zap, vibe, beep]
      properties:
        zap: { $ref: '#/components/schemas/StimulusPermission' }
        vibe: { $ref: '#/components/schemas/StimulusPermission' }
        beep: { $ref: '#/components/schemas/StimulusPermission' }

    User:
      type: object
      required: [id, handle, displayName]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }

    ServerPolicies:
      type: object
      description: Server-wide rules a client may want to explain to its user.
      required: [automationConsentRequired]
      properties:
        automationConsentRequired:
          type: boolean
          description: >
            True: a friend's automated pokes are blocked until you allow them
            (per friend and stimulus, `automationAllowed: true`). False: they
            are allowed unless you block them. Set by the server operator —
            either the `AUTOMATION_CONSENT_REQUIRED` environment variable or
            an admin.

    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [email, inviteCode, policies]
          properties:
            email: { type: string, format: email }
            inviteCode:
              type: string
              description: Shown as text + QR in the app's "Add friend" sheet so someone else can add you.
            policies: { $ref: '#/components/schemas/ServerPolicies' }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Bearer JWT for subsequent requests }
        user: { $ref: '#/components/schemas/Me' }

    Friend:
      type: object
      required: [id, handle, displayName, permissionsGrantedToMe, permissionsIGranted]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        permissionsGrantedToMe:
          description: What THEY allow you to send them — drives the poke composer's options.
          allOf: [{ $ref: '#/components/schemas/FriendPermissionSet' }]
        permissionsIGranted:
          description: What you allow THEM to send you — yours to edit via PUT .../permissions/{stimulusKind}.
          allOf: [{ $ref: '#/components/schemas/FriendPermissionSet' }]

    FriendRequest:
      type: object
      required: [id, handle, displayName, direction, createdAt]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        createdAt: { type: string, format: date-time }

    PokeDeliveryStatus:
      type: string
      enum: [pending, fired, deviceNotConnected, notAllowed, muted]
      description: >
        `pending`: accepted and pushed, but no device has acked yet — this is
        the status every poke is created with. Every other value is terminal
        and is only ever set by `POST /pokes/{pokeId}/ack`. `fired`: reached
        the device and actuated it. `deviceNotConnected`: push arrived but the
        recipient's Pavlok wasn't connected. `notAllowed`: server-side
        permission re-check rejected it (should be rare — the composer
        client-clamps first). `muted`: recipient had "Do not disturb incoming
        pokes" on.


        Clients should treat a `pending` poke older than a few minutes as
        undelivered: iOS gives no delivery guarantee for the silent push, so
        an ack may simply never arrive.

    PokeEvent:
      type: object
      required:
        - id
        - direction
        - friendHandle
        - friendDisplayName
        - stimulus
        - status
        - createdAt
        - ackedAt
        - viaApiToken
        - apiTokenName
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [sent, received] }
        friendHandle: { type: string }
        friendDisplayName: { type: string }
        stimulus: { $ref: '#/components/schemas/StimulusConfig' }
        status: { $ref: '#/components/schemas/PokeDeliveryStatus' }
        createdAt: { type: string, format: date-time }
        ackedAt:
          type: [string, 'null']
          format: date-time
          description: >
            When the recipient's device reported back, i.e. when `status`
            stopped being `pending`. Null until then — and possibly forever,
            since iOS guarantees no delivery for the silent push.
        viaApiToken:
          type: boolean
          description: >
            Sent through a personal access token — the sender's automation —
            rather than by the sender in person. Visible to both sides, and
            still true after the token is revoked.
        apiTokenName:
          type: string
          nullable: true
          description: >
            The name the sender gave that token. Only ever sent to the
            sender (for a self-stimulus that is also the recipient); always
            null for the recipient, for a poke sent in person, and once the
            token has been revoked.

    PokePushPayload:
      type: object
      description: >
        Not a REST resource — this is the shape of the `"poke"` object inside
        the APNs payloads `POST /pokes` triggers. Self-contained (the exact
        stimulus to fire, sender name for the alert text) so the background
        silent-push handler never needs a round-trip API call before it can
        act, given iOS's tight execution budget for those.
        See `PokePushPayload(userInfo:)` in the mobile client.


        Two *separate* pushes are sent per poke. They cannot be combined:
        iOS suppresses the background wake when an `alert` is present in the
        same payload.


        1. Alert push — `apns-push-type: alert`, priority 10. Guarantees the
        recipient finds out. This is the payload in `example` below.


        2. Silent push — `apns-push-type: background`, priority 5, and an
        `aps` of exactly `{"content-available": 1}` with the same `type` and
        `poke` keys alongside it. Best effort: it may fire the stimulus
        without the recipient touching anything, but iOS gives no
        delivery-time guarantee and throttles these aggressively.
      required: [pokeID, senderHandle, senderDisplayName, recipientHandle, stimulus, sentAt, viaApiToken]
      properties:
        pokeID: { type: string, format: uuid }
        senderHandle: { type: string }
        senderDisplayName: { type: string }
        recipientHandle:
          type: string
          description: >
            Who the poke is addressed to. A device is registered to exactly
            one account at a time, but a stale registration (account switched,
            token reassigned) is otherwise invisible from the payload: the
            push arrives, the wearable fires, and the only trace is an ack the
            server 404s. A client that knows its own handle should compare it
            and drop a poke addressed to somebody else rather than fire it.
        stimulus: { $ref: '#/components/schemas/StimulusConfig' }
        sentAt:
          type: string
          format: date-time
          description: >
            When the server accepted the poke. The alert body already carries
            a rendered time, but in the *server's* configured zone
            (`PUSH_TIME_ZONE`) — a client that wants the recipient's own local
            time formats this instead.
        viaApiToken:
          type: boolean
          description: >
            Sent by the sender's automation (a personal access token), not by
            the sender in person. The alert body already ends in
            " (automation)" when this is true; the flag is for clients that
            render their own text or badge. The token's name is never sent to
            the recipient.
        serverId:
          type: string
          description: >
            The relay `serverId` of the server that sent the poke. Required
            inside every relay envelope, where the app must check it equals
            the envelope's outer `srv` and drop the push if it does not. May
            be absent in direct APNs pushes.
      example:
        aps:
          alert:
            title: Alice
            body: zapped you — 30% at 14:32 UTC
          sound: default
        type: poke
        poke:
          pokeID: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          senderHandle: alice
          senderDisplayName: Alice
          recipientHandle: bob
          stimulus: { kind: zap, intensity: 30, repetitions: 1 }
          sentAt: '2026-09-21T14:32:00Z'
          viaApiToken: false

    DevicePlatform:
      type: string
      enum: [ios, android]

    PushTransport:
      type: string
      enum: [apns, relay]
      description: >
        How a registered device's pushes leave the server: straight to APNs
        with the server's own credentials, or through the Jolt push relay.

    Device:
      type: object
      required: [id, platform, transport, tokenSuffix, isActive, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        transport: { $ref: '#/components/schemas/PushTransport' }
        tokenSuffix:
          type: string
          description: >
            Last 8 characters of the APNs token (or of the relay token), so a
            device can spot itself.
        isActive:
          type: boolean
          description: False once APNs or the relay has reported the token unregistered.
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    TestPushDeviceResult:
      type: object
      required: [deviceId, ok]
      properties:
        deviceId: { type: string, format: uuid }
        ok: { type: boolean }
        reason:
          type: string
          enum: [unregistered, transient, rejected]
          description: Present only when `ok` is false.
        detail:
          type: string
          description: APNs' own reason string, when it gave one.

    TestPushAck:
      type: object
      required: [deviceId, path, receivedAt, elapsedMs]
      properties:
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: Null when the client could not attribute the ack to a device.
        path:
          type: string
          enum: [alert, background, foreground]
          description: >
            Which iOS entry point saw the push: the notification tap
            (`alert`), the silent `content-available` wake (`background`), or
            in-app foreground presentation (`foreground`).
        status:
          type: string
          enum: [fired, deviceNotConnected, notAllowed, muted]
        receivedAt: { type: string, format: date-time }
        elapsedMs:
          type: integer
          minimum: 0
          description: Round trip from send to confirmation.

    TestPushStatus:
      type: object
      description: >
        Live state of one test push. Held in the server's memory for 10
        minutes rather than in the database — a test is only interesting while
        you are watching it.
      required: [testID, sentAt, source, apnsConfigured, pushTransport, devices, acks]
      properties:
        testID: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        source: { type: string, enum: [web, app] }
        stimulus: { $ref: '#/components/schemas/StimulusConfig' }
        apnsConfigured:
          type: boolean
          description: >
            False when the server delivers no pushes and is logging to the
            console instead; a test will never be acked. True for a server
            that delivers through the relay as well, despite the name. Kept
            for clients that predate `pushTransport`, which says more.
        pushTransport:
          type: string
          enum: [apns, relay, none]
          description: >
            How this server delivers pushes, as `GET /push/config` reports it:
            its own APNs credentials, the push relay, or not at all.
        devices:
          type: array
          items: { $ref: '#/components/schemas/TestPushDeviceResult' }
        acks:
          type: array
          items: { $ref: '#/components/schemas/TestPushAck' }

    TestPushPayload:
      type: object
      description: >
        Not a REST resource — the shape of the `"test"` object inside the APNs
        payloads `POST /devices/test-push` triggers. Sent as the same alert +
        silent pair as a poke (see `PokePushPayload`), so a test exercises
        both delivery paths.


        `type` is `"test"`, not `"poke"`: there is no `poke_event` row behind
        it, so the client acks to `/devices/test-push/{testID}/ack` and — for
        a payload with no `stimulus` — leaves the wearable alone entirely.
      required: [testID, deviceID, sentAt, source]
      properties:
        testID: { type: string, format: uuid }
        deviceID:
          type: string
          format: uuid
          description: The device this copy went to. Echo it back in the ack.
        sentAt: { type: string, format: date-time }
        source: { type: string, enum: [web, app] }
        stimulus:
          allOf: [{ $ref: '#/components/schemas/StimulusConfig' }]
          description: Absent for a notification-only test.
        serverId:
          type: string
          description: As on `PokePushPayload`. Required inside relay envelopes; may be absent in direct APNs pushes.
      example:
        aps:
          alert:
            title: Jolt
            body: Test notification — push delivery works, sent 10:15 UTC.
          sound: default
        type: test
        test:
          testID: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          deviceID: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          sentAt: '2026-09-07T10:15:00Z'
          source: web

    PushConfig:
      type: object
      required: [transport]
      properties:
        transport:
          type: string
          enum: [apns, relay, none]
        apnsEnvironment:
          type: string
          enum: [sandbox, production]
          description: Present only for `apns`.
        relay:
          type: object
          description: Present only for `relay`.
          required: [url, serverId]
          properties:
            url: { type: string, format: uri }
            serverId:
              type: string
              description: This server's id at the relay, `srv_` and 26 base32 characters.
      example:
        transport: relay
        relay:
          url: https://relay.example/
          serverId: srv_kzdvvj2umnduyauf35o36k6kw4

    ApnsPushTokenRegistration:
      type: object
      description: >
        A device the server pushes to directly with its own APNs credentials.
        The only shape before the relay; `transport` is optional and means
        `apns` when absent.
      required: [token, platform]
      properties:
        transport: { type: string, enum: [apns] }
        token: { type: string, description: Hex-encoded APNs device token }
        platform: { type: string, enum: [ios] }

    RelayPushTokenRegistration:
      type: object
      description: >
        A device registered with the Jolt push relay. The server never sees
        its APNs or FCM token: it pushes to `relayToken`, sealing each payload
        with `payloadKey` so the relay cannot read it.
      required: [transport, platform, relayToken, payloadKey, keyId]
      properties:
        transport: { type: string, enum: [relay] }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        relayToken:
          type: string
          pattern: '^rt_[A-Za-z0-9_-]{43}$'
          description: Issued by the relay for this device and this server.
        payloadKey:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 32 random bytes, base64url without padding, generated by the app.
        keyId:
          type: string
          pattern: '^[A-Za-z0-9_-]{11}$'
          description: base64url of the first 8 bytes of SHA-256(payloadKey).

    ApiTokenScope:
      type: string
      enum: ['*', 'stimulus:self', 'pokes:send', 'friends:read', 'pokes:read']
      description: >
        What a personal access token may do. `*` is every scope, including
        any added after the token was minted. `stimulus:self` fires at your
        own devices (`POST /me/stimulus`). `pokes:send` pokes friends
        (`POST /pokes`). `friends:read` lists them (`GET /friends`).
        `pokes:read` reads the activity log (`GET /pokes`). `GET /me` needs
        no scope.

    ApiTokenFriendScope:
      type: string
      enum: [all, selected]
      description: >
        `all`: every friend, including ones added later. `selected`: only
        `friendIds` — and an empty list, which unfriending can leave behind,
        reaches nobody rather than everybody.

    ApiToken:
      type: object
      description: >
        A personal access token as listed back to its owner. The secret is
        returned exactly once, by `POST /me/tokens`, and only its hash is
        stored — there is no endpoint that can show it again.
      required:
        - id
        - name
        - prefix
        - createdAt
        - lastUsedAt
        - expiresAt
        - scopes
        - friendScope
        - friendIds
        - allowedKinds
        - maxIntensity
        - minIntervalSeconds
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: Leading characters of the secret, so a row is recognisable in the list.
        createdAt: { type: string, format: date-time }
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Null until first use. Written at most once a minute, so it answers
            "is this still in use?" rather than "when exactly was the last call".
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null means it lives until revoked.
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ApiTokenScope' }
        friendScope: { $ref: '#/components/schemas/ApiTokenFriendScope' }
        friendIds:
          type: array
          items: { type: string, format: uuid }
          description: >
            The friends a `selected` token reaches. Always empty for `all`.
            Unfriending someone removes them from every token on both sides.
        allowedKinds:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/StimulusKind' }
          description: The kinds it may fire. Null is every kind.
        maxIntensity:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Its own intensity ceiling. Null leaves only the recipient's cap.
        minIntervalSeconds:
          type: integer
          minimum: 1
          description: Minimum seconds between two stimuli fired with it.

    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret, e.g. `jolt_pat_…`. Shown once. Store it now.

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        error:
          type: string
          description: >
            A stable machine-readable code, present only on the answers a
            client is expected to act on: `relay_token_revoked` (410 from
            `POST /devices/push-token`). `message` is for people and may
            change.
